name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.318 # pinned: bump deliberately after checking `claude plugin validate`

jobs:
  skills:
    name: Skills & manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PR diff + tags

      - uses: oven-sh/setup-bun@v2

      - name: JSON manifests are valid
        run: |
          for f in .claude-plugin/*.json; do jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }; done

      - name: Validate skills (YAML frontmatter, size, map, links, English only)
        run: scripts/validate.sh

      - name: Validator self-test
        run: scripts/test-validate.sh

      - name: gen-env.ts regression tests
        run: bun test scripts/tests

      - name: Config presets work in a consumer repo
        run: scripts/test-presets.sh

      - name: Validate plugin + marketplace (claude plugin validate)
        run: bunx "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate .

      - name: Version and changelog are consistent
        run: |
          v=$(jq -r .version .claude-plugin/plugin.json)
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::plugin.json version '$v' is not semver"; exit 1; }
          if [ "$v" != 0.0.0 ]; then # 0.0.0 = nothing released yet
            grep -q "^## \[$v\] - " CHANGELOG.md || { echo "::error file=CHANGELOG.md::no entry for $v"; exit 1; }
          fi
          if jq -e '.plugins[0].version' .claude-plugin/marketplace.json >/dev/null; then
            echo "::error file=.claude-plugin/marketplace.json::keep version only in plugin.json"; exit 1
          fi

      - name: Skill changes add a changelog line (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          if [[ $HEAD_REF == release/v* ]]; then
            # A release PR may only bump the manifest and move the changelog.
            extra=$(printf '%s\n' "$changed" | grep -vxE '\.claude-plugin/plugin\.json|CHANGELOG\.md' || true)
            [ -z "$extra" ] || { echo "::error::release PR touches more than plugin.json + CHANGELOG.md: $extra"; exit 1; }
            m=.claude-plugin/plugin.json
            old=$(git show "$BASE:$m" | jq -r .version); new=$(jq -r .version "$m")
            [ "release/v$new" = "$HEAD_REF" ] || { echo "::error::branch $HEAD_REF but plugin.json says $new"; exit 1; }
            [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" = "$new" ] && [ "$old" != "$new" ] || { echo "::error::version must increase ($old → $new)"; exit 1; }
            [ "$(git show "$BASE:$m" | jq -S 'del(.version)')" = "$(jq -S 'del(.version)' "$m")" ] || { echo "::error::release PR may change only the version in $m"; exit 1; }
            grep -q "^## \[$new\] - " CHANGELOG.md || { echo "::error file=CHANGELOG.md::no section for $new"; exit 1; }
            exit 0
          fi
          printf '%s\n' "$changed" | grep -qE '^(skills|\.claude-plugin)/' || exit 0
          unreleased() { awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} /^\[/{f=0} f' | sed '/^[[:space:]]*$/d'; }
          git show "$BASE:CHANGELOG.md" | unreleased | sort >/tmp/base.txt
          unreleased <CHANGELOG.md | sort >/tmp/head.txt
          if [ -z "$(comm -13 /tmp/base.txt /tmp/head.txt | grep '^- ' || true)" ]; then
            echo "::error file=CHANGELOG.md::skills/ changed — add a new '- …' line under [Unreleased]"; exit 1
          fi

  lint:
    name: Scripts & workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  macos:
    name: Scripts on macOS (bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: /bin/bash scripts/validate.sh
      - run: /bin/bash scripts/test-validate.sh
